server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA React Router : toute route inconnue retombe sur index.html, sinon
    # un rechargement sur /a-propos ou /admin renverrait un 404 nginx.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Assets Vite : noms de fichiers empreints (hash), donc invalidation
    # automatique — un cache long est sans risque.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
