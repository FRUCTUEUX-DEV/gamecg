; Les trois processus du conteneur, demarres et surveilles ensemble.
; L'ordre de priority n'attend pas qu'un service soit "pret" (voir
; docker-entrypoint.sh pour la preparation de Postgres et les migrations,
; qui se font AVANT de lancer supervisord).
[supervisord]
nodaemon=true
user=root
loglevel=info

[program:postgres]
command=su-exec postgres postgres -D %(ENV_PGDATA)s
priority=1
autorestart=true
stopsignal=INT
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:laravel]
command=php artisan serve --host=127.0.0.1 --port=8000
directory=/var/www/html
priority=2
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
priority=3
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
