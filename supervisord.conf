; Les deux processus du conteneur, demarres et surveilles ensemble. La base
; est externe (Render) : pas de postgres local a superviser ici. Les
; migrations se font AVANT de lancer supervisord (voir docker-entrypoint.sh).
[supervisord]
nodaemon=true
user=root
loglevel=info

[program:laravel]
command=php artisan serve --host=0.0.0.0 --port=8000
directory=/var/www/html
priority=1
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Frontend construit, servi par le serveur integre de PHP (pas de nginx) :
; spa-router.php sert les fichiers existants tels quels et retombe sur
; index.html pour les routes React Router.
[program:frontend]
command=php -S 0.0.0.0:80 -t /var/www/frontend /var/www/frontend/spa-router.php
priority=2
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
