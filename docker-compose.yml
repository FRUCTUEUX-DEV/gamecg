services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-herboquiz}
      POSTGRES_USER: ${DB_USERNAME:-herboquiz}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-herboquiz}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-herboquiz} -d ${DB_DATABASE:-herboquiz}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./herboquiz_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_NAME: ${APP_NAME:-HerboQuiz}
      APP_ENV: ${APP_ENV:-local}
      APP_KEY: ${APP_KEY}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_TIMEZONE: Africa/Porto-Novo
      APP_URL: ${APP_URL:-http://localhost:8000}
      LOG_CHANNEL: stack
      LOG_LEVEL: ${LOG_LEVEL:-warning}
      # Meme moteur qu'en production (voir le commentaire dans
      # herboquiz_backend/.env) : Postgres partout, plus de MySQL local.
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-herboquiz}
      DB_USERNAME: ${DB_USERNAME:-herboquiz}
      DB_PASSWORD: ${DB_PASSWORD:-herboquiz}
      SESSION_DRIVER: file
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
      SESSION_MINUTES: 720
      HERBOQUIZ_PROPRIETAIRE: ${HERBOQUIZ_PROPRIETAIRE:-Kaido}
      # Passe a "true" pour peupler reglages/acces/membres au demarrage
      # (DatabaseSeeder). Les jeux de donnees de demo restent manuels.
      DB_SEED: ${DB_SEED:-true}
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./herboquiz_frontend
      args:
        # Doit rester joignable depuis le NAVIGATEUR : le port publie du
        # backend sur l'hote, pas le nom de service Docker interne.
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000/api}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  pgdata:
